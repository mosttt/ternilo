services:
  server:
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${TERNILO_POSTGRES_ADMIN_PASSWORD:?Set TERNILO_POSTGRES_ADMIN_PASSWORD in .env}
      TERNILO_POSTGRES_OWNER_PASSWORD: ${TERNILO_POSTGRES_OWNER_PASSWORD:?Set TERNILO_POSTGRES_OWNER_PASSWORD in .env}
      TERNILO_POSTGRES_APP_PASSWORD: ${TERNILO_POSTGRES_APP_PASSWORD:?Set TERNILO_POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-ternilo.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    # The database is reachable inside the Compose network; no host port is published.

volumes:
  postgres-data:
