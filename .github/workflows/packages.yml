name: Build packages
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build one target, or all release targets
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
  workflow_call:
    inputs:
      target:
        type: string
        default: all

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: matrix
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          targets = json.loads(Path(".github/package-targets.json").read_text())
          selected = os.environ["REQUESTED_TARGET"]
          if selected != "all":
              targets = [entry for entry in targets if entry["target"] == selected]
          if not targets:
              raise ValueError("Unknown package target")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("targets=" + json.dumps({"include": targets}, separators=(",", ":")), file=output)
          PY
  packages:
    needs: matrix
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-packages-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: ternilo
    env:
      RUST_TARGET: ${{ matrix.target }}
      BINARY_SUFFIX: ${{ matrix.suffix }}
      BUNDLES: ${{ matrix.bundles }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ternilo
          persist-credentials: false
      - uses: ./ternilo/.github/actions/prepare
        with:
          target: ${{ matrix.target }}
      - id: info
        run: python scripts/ci/release-info.py
      - name: Shared Web and release binaries
        run: |
          npm --prefix web run build
          cargo build --locked --release --target "$RUST_TARGET" -p ternilo -p ternilo-server -p ternilo-plugin-cli
          "target/$RUST_TARGET/release/ternilo$BINARY_SUFFIX" --version
          "target/$RUST_TARGET/release/ternilo-server$BINARY_SUFFIX" --version
      - name: Windows sandbox sidecar
        if: runner.os == 'Windows'
        run: python scripts/prepare-windows-sidecar.py --target "$RUST_TARGET"
      - name: Desktop installers
        working-directory: ternilo/apps/ternilo-desktop
        run: npm exec --yes --package @tauri-apps/cli@2.12.0 -- tauri build --ci --target "$RUST_TARGET" --bundles "$BUNDLES" -- --locked
      - name: Windows executable architecture and subsystem
        if: runner.os == 'Windows'
        run: |
          python - "$RUST_TARGET" <<'PY'
          import pathlib, struct, sys
          directory = pathlib.Path("target") / sys.argv[1] / "release"
          machine = 0xaa64 if sys.argv[1].startswith("aarch64-") else 0x8664
          for name, expected in [("ternilo-desktop", 2), ("ternilo", 3), ("ternilo-server", 3), ("ternilo-plugin", 3), ("ternilo-sandbox-windows", 3)]:
              data = (directory / (name + ".exe")).read_bytes()
              header = struct.unpack_from("<I", data, 0x3c)[0]
              assert data[header:header + 4] == b"PE\0\0"
              actual = struct.unpack_from("<H", data, header + 4)[0]
              assert actual == machine, (name, hex(actual), hex(machine))
              subsystem = struct.unpack_from("<H", data, header + 24 + 68)[0]
              assert subsystem == expected, (name, subsystem, expected)
          PY
      - name: Windows ARM64 persistence and workspace boundaries
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          cargo test --locked --release --target "$RUST_TARGET" -p ternilo-local --lib state::tests
          cargo test --locked --release --target "$RUST_TARGET" -p ternilo-local --lib application::workspace_browser
          cargo test --locked --release --target "$RUST_TARGET" -p ternilo-builtins --lib process_supervision
      - name: Desktop background service lifecycle
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: python scripts/ci/desktop-service-smoke.py --desktop "target/$RUST_TARGET/release/ternilo-desktop$BINARY_SUFFIX" --expected-version "$VERSION"
      - name: Portable client and Server packages
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          for component in local server; do
            if [ -n "$BINARY_SUFFIX" ]; then
              bash scripts/package-release.sh --component "$component" --version "$VERSION" --no-build --bin-dir "target/$RUST_TARGET/release" --target-name "$RUST_TARGET" --binary-suffix "$BINARY_SUFFIX" --output-dir dist/release
            else
              bash scripts/package-release.sh --component "$component" --version "$VERSION" --no-build --bin-dir "target/$RUST_TARGET/release" --target-name "$RUST_TARGET" --output-dir dist/release
            fi
          done
          python scripts/ci/release-info.py --collect "target/$RUST_TARGET/release/bundle" --output dist/release --target "$RUST_TARGET"
          python scripts/ci/release-info.py --checksums dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-${{ matrix.target }}
          path: ternilo/dist/release/*
          if-no-files-found: error
          retention-days: 14
