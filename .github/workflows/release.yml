name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.info.outputs.version }}
      image: ${{ steps.info.outputs.image }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ternilo
          persist-credentials: false
      - id: info
        working-directory: ternilo
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$PUBLISH" = true ]; then python3 scripts/ci/release-info.py --publish; else python3 scripts/ci/release-info.py; fi
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      skip-packages: true
  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
  server-image-build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ternilo
          persist-credentials: false
      - id: linorun
        run: echo "revision=$(cat ternilo/.github/linorun-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mosttt/linorun
          ref: ${{ steps.linorun.outputs.revision }}
          path: linorun
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Reserve build space on the disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Build candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ternilo
          file: ternilo/deploy/docker/Dockerfile
          target: server
          build-contexts: linorun=./linorun
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ternilo-server:ci-${{ matrix.arch }}
          build-args: |
            CARGO_BUILD_JOBS=2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=ternilo-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ternilo-server-${{ matrix.arch }}
      - name: Validate the actual image
        run: python3 ternilo/scripts/ci/server-image-smoke.py --image ternilo-server:ci-${{ matrix.arch }}
      - name: Save the tested candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          mkdir -p image-candidate
          test "$(docker image inspect "ternilo-server:ci-$ARCH" --format '{{.Architecture}}')" = "$ARCH"
          docker save "ternilo-server:ci-$ARCH" | gzip -1 > "image-candidate/server-image-$ARCH.tar.gz"
          docker image inspect "ternilo-server:ci-$ARCH" --format '{{.Id}}' > "image-candidate/server-image-$ARCH.id"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-image-candidate-${{ matrix.arch }}
          path: image-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  server-image:
    needs: [version, checks, packages, server-image-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: server-image-candidate-*
          path: image-candidate
          merge-multiple: true
      - name: Load the exact tested image
        run: |
          for arch in amd64 arm64; do
            docker load --input "image-candidate/server-image-$arch.tar.gz"
            test "$(docker image inspect "ternilo-server:ci-$arch" --format '{{.Id}}')" = "$(cat "image-candidate/server-image-$arch.id")"
            test "$(docker image inspect "ternilo-server:ci-$arch" --format '{{.Architecture}}')" = "$arch"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p image-metadata
          sources=()
          for arch in amd64 arm64; do
            destination="$IMAGE:sha-$GITHUB_SHA-$arch"
            docker tag "ternilo-server:ci-$arch" "$destination"
            docker push "$destination"
            digest=$(docker image inspect "$destination" --format '{{index .RepoDigests 0}}')
            sources+=("$digest")
            printf 'linux/%s %s\n' "$arch" "$digest" >> image-metadata/server-image.txt
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > image-metadata/server-image-index.json
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          index = json.loads(Path('image-metadata/server-image-index.json').read_text())
          actual = {(m['platform']['os'], m['platform']['architecture']): m['digest'] for m in index['manifests']}
          expected = {tuple(platform.split('/')): reference.split('@')[1] for platform, reference in (line.split() for line in Path('image-metadata/server-image.txt').read_text().splitlines())}
          assert actual == expected, (actual, expected)
          PYVERIFY
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' >> image-metadata/server-image.txt
      - name: Retain candidate metadata
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p image-metadata
          for arch in amd64 arm64; do
            printf 'linux/%s %s\n' "$arch" "$(cat "image-candidate/server-image-$arch.id")" >> image-metadata/server-image.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-image-metadata
          path: image-metadata/*
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, checks, packages, server-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ternilo
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: server-image-metadata
          path: artifacts
      - name: Checksums and source provenance
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf 'version=%s\ncommit=%s\nlinorun=%s\n' "$VERSION" "$GITHUB_SHA" "$(cat ternilo/.github/linorun-revision)" > artifacts/SOURCE
          cp ternilo/deploy/docker/compose.server.yml artifacts/compose.server.yml
          sed 's|(../en/docker-compose.md)|(docker-compose.en.md)|g' ternilo/docs/zh-CN/docker-compose.md > artifacts/docker-compose.md
          sed 's|(../zh-CN/docker-compose.md)|(docker-compose.md)|g' ternilo/docs/en/docker-compose.md > artifacts/docker-compose.en.md
          python3 ternilo/scripts/ci/release-info.py --checksums artifacts
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -f "ternilo/docs/zh-CN/releases/$VERSION.md" ] && [ -f "ternilo/docs/en/releases/$VERSION.md" ]; then
            cat "ternilo/docs/zh-CN/releases/$VERSION.md" > release-notes.md
            printf '\n---\n\n' >> release-notes.md
            cat "ternilo/docs/en/releases/$VERSION.md" >> release-notes.md
          else
            printf '%s\n\n' 'Client and Server binaries, desktop installers, and the tested Server image digest are attached.' 'Desktop installers are unsigned; automatic updates remain disabled.' 'Download compose.server.yml and docker-compose.md to deploy the published image without a local build.' > release-notes.md
          fi
          printf 'Server image: `%s:%s` (linux/amd64, linux/arm64).\n' "$IMAGE" "$VERSION" >> release-notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --draft --title "Ternilo $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
