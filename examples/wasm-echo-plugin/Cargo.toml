[package]
name = "ternilo-extension-wasm-echo"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
wit-bindgen = "0.60.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
