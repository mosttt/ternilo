[workspace]
members = [
    "apps/ternilo",
    "apps/ternilo-desktop",
    "apps/ternilo-plugin",
    "apps/ternilo-server",
    "apps/ternilo-sandbox-windows",
    "apps/ternilo-worker",
    "crates/ternilo-builtins",
    "crates/ternilo-authorization",
    "crates/ternilo-acp",
    "crates/ternilo-automation",
    "crates/ternilo-cloud",
    "crates/ternilo-code-runtime",
    "crates/ternilo-control",
    "crates/ternilo-extension",
    "crates/ternilo-kernel",
    "crates/ternilo-local",
    "crates/ternilo-protocol",
    "crates/ternilo-rhai",
    "crates/ternilo-storage",
    "crates/ternilo-transport",
    "crates/ternilo-transport-store",
]
exclude = ["examples/wasm-echo-plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
version = "0.2.8"

[workspace.dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
agent-client-protocol = "2.0.0"
argon2 = "0.5.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.5", features = ["derive", "env"] }
command-fds = { version = "0.3.3", features = ["tokio"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures-util = "0.3.34"
hmac = "0.13"
nix = { version = "0.31.0", default-features = false, features = ["dir", "fs", "signal"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["logs"] }
rand = "0.10"
regex = "1.12"
rhai = { version = "1.25.1", features = ["serde", "sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rmcp = { version = "3.1.3", default-features = false, features = ["client", "transport-child-process"] }
rustix = { version = "1.1.4", features = ["event", "process"] }
linorun-core = { path = "../linorun/crates/linorun-core" }
linorun-macros = { path = "../linorun/crates/linorun-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
schemars = { version = "1.2.2", features = ["derive"] }
semver = "1.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["any", "json", "macros", "migrate", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring-webpki"] }
salvo_core = { version = "0.95.2", default-features = false, features = ["http1", "server", "server-handle"] }
salvo_extra = { version = "0.95.2", default-features = false, features = ["affix-state", "size-limiter", "websocket"] }
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-rusqlite = { version = "0.7.0", features = ["backup", "bundled"] }
tempfile = "3.27.0"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = { version = "2.7.2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
jsonschema = { version = "0.48.5", default-features = false }
zeroize = "1.9.0"
wasmtime = { version = "48.0.5", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
wit-component = "0.257.1"
ternilo-builtins = { path = "crates/ternilo-builtins" }
ternilo-authorization = { path = "crates/ternilo-authorization" }
ternilo-acp = { path = "crates/ternilo-acp" }
ternilo-automation = { path = "crates/ternilo-automation" }
ternilo-cloud = { path = "crates/ternilo-cloud" }
ternilo-code-runtime = { path = "crates/ternilo-code-runtime" }
ternilo-control = { path = "crates/ternilo-control" }
ternilo-extension = { path = "crates/ternilo-extension" }
ternilo-kernel = { path = "crates/ternilo-kernel" }
ternilo-local = { path = "crates/ternilo-local" }
ternilo-protocol = { path = "crates/ternilo-protocol" }
ternilo-rhai = { path = "crates/ternilo-rhai" }
ternilo-storage = { path = "crates/ternilo-storage" }
ternilo-transport = { path = "crates/ternilo-transport" }
ternilo-transport-store = { path = "crates/ternilo-transport-store" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
